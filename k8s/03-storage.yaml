apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: genuc-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: cbs-csi
---
