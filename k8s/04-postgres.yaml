apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genuc-postgres
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: genuc-platform
spec:
  serviceName: genuc-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/name: genuc
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "genuc_db"
            - name: POSTGRES_USER
              value: "genuc_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genuc-secrets
                  key: DB_PASSWORD
            - name: REPLICATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genuc-secrets
                  key: REPLICATOR_PASSWORD
          args:
            - postgres
            - -c
            - wal_level=replica
            - -c
            - max_wal_senders=3
            - -c
            - wal_keep_size=64
            - -c
            - max_connections=200
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=1GB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=64MB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init-replica.sh
              subPath: init-replica.sh
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "genuc_user", "-d", "genuc_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "genuc_user", "-d", "genuc_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: init-script
          configMap:
            name: postgres-config
            items:
              - key: init-replica.sh
                path: init-replica.sh
                mode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: cbs-csi
---
apiVersion: v1
kind: Service
metadata:
  name: genuc-postgres
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: postgres
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/component: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genuc-postgres-replica
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: postgres-replica
    app.kubernetes.io/part-of: genuc-platform
spec:
  serviceName: genuc-postgres-replica
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres-replica
        app.kubernetes.io/name: genuc
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "genuc_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: genuc-secrets
                  key: REPLICA_PASSWORD
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: genuc-secrets
                  key: REPLICATOR_PASSWORD
          command:
            - bash
            - "-c"
            - |
              until pg_basebackup -h genuc-postgres -D /var/lib/postgresql/data \
                -U replicator -Fp -Xs -P -R 2>/dev/null; do
                echo "Waiting for primary..." && sleep 3
              done
              postgres
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "genuc_user"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "genuc_user"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: cbs-csi
---
apiVersion: v1
kind: Service
metadata:
  name: genuc-postgres-replica
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: postgres-replica
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/component: postgres-replica
  clusterIP: None
