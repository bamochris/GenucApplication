apiVersion: apps/v1
kind: Deployment
metadata:
  name: genuc-tempo
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: tempo
    app.kubernetes.io/part-of: genuc-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/component: tempo
        app.kubernetes.io/name: genuc
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:latest
          args:
            - "-config.file=/etc/tempo.yaml"
          ports:
            - containerPort: 4318
              name: otlp
            - containerPort: 3200
              name: query
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
            - name: data
              mountPath: /tmp/tempo
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: genuc-tempo
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/component: tempo
spec:
  ports:
    - port: 4318
      targetPort: 4318
      name: otlp
    - port: 3200
      targetPort: 3200
      name: query
  selector:
    app.kubernetes.io/component: tempo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/part-of: genuc-platform
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 48h
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo
        wal:
          path: /tmp/tempo/wal
