# GABARIT — ne contient volontairement aucune valeur.
#
# NE JAMAIS remplir ce fichier puis le committer : la version précédente,
# k8s/02-secrets.yaml, a été poussée sur un dépôt GitHub public avec 9 secrets
# en clair. Supprimer un fichier n'efface pas l'historique Git : la seule
# remédiation valable est la ROTATION des secrets concernés.
#
# Utilisation :
#   cp k8s/02-secrets.example.yaml k8s/02-secrets.yaml   # ignoré par .gitignore
#   # renseigner les valeurs, puis :
#   kubectl apply -f k8s/02-secrets.yaml
#
# En production, préférer un gestionnaire de secrets à un fichier local :
# sur Tencent Cloud, TKE s'intègre à Secrets Manager (SSM) via le CSI driver.
apiVersion: v1
kind: Secret
metadata:
  name: genuc-secrets
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/part-of: genuc-platform
type: Opaque
stringData:
  # ─── PostgreSQL ──────────────────────────────────────────────────────
  DB_PASSWORD: ""
  REPLICA_PASSWORD: ""
  REPLICATOR_PASSWORD: ""
  # ─── JWT ─────────────────────────────────────────────────────────────
  JWT_SECRET: ""
  # ─── SMTP ────────────────────────────────────────────────────────────
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  # ─── Redis ───────────────────────────────────────────────────────────
  REDIS_PASSWORD: ""
  # ─── AWS S3 (optionnel) ──────────────────────────────────────────────
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  # ─── Mobile Money / TachPay ──────────────────────────────────────────
  WEBHOOK_SECRET: ""
  WEBHOOK_VODACOM_SECRET: ""
  WEBHOOK_AIRTEL_SECRET: ""
  WEBHOOK_ORANGE_SECRET: ""
  WEBHOOK_AFRIMONEY_SECRET: ""
  VODACOM_API_KEY: ""
  VODACOM_API_SECRET: ""
  MPESA_CONSUMER_KEY: ""
  MPESA_CONSUMER_SECRET: ""
  ORANGE_API_KEY: ""
  ORANGE_API_SECRET: ""
  AIRTEL_API_KEY: ""
  AIRTEL_API_SECRET: ""
  AFRIMONEY_CLIENT_ID: ""
  AFRIMONEY_CLIENT_SECRET: ""
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  # ─── Comptes de test ─────────────────────────────────────────────────
  TEST_ADMIN_GENUC: ""
  TEST_ETUDIANT: ""
