apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genuc-default-deny-all
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/part-of: genuc-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genuc-allow-frontend
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/part-of: genuc-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: genuc-allow-backend
  namespace: genuc
  labels:
    app.kubernetes.io/name: genuc
    app.kubernetes.io/part-of: genuc-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: 8082
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - port: 8082
          protocol: TCP
    # Scrape Prometheus : /actuator/prometheus est ouvert au niveau applicatif
    # (un scraper ne présente pas de JWT), le cloisonnement se fait donc ici.
    # Seuls les pods du namespace de supervision atteignent le port 8082.
    # Le namespace doit porter le label kubernetes.io/metadata.name: monitoring
    # (posé automatiquement par Kubernetes >= 1.21).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8082
          protocol: TCP
---
