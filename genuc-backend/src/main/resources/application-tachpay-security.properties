# ============================================================================
# TACHPAY SECURITY CONFIGURATION
# ============================================================================
# Configuration de sécurité renforcée pour TachPay après l'implémentation
# des corrections critiques (idempotence, validation montant, whitelist IP)
# ============================================================================

# ─── Sécurité Webhook (existante) ────────────────────────────────────────
# Ces propriétés étaient déjà présentes, mais sont rappelées pour contexte

# Obligation de signature webhook (NE JAMAIS désactiver en production)
genuc.webhook.require-signature=true

# Secret global optionnel (fallback si secret par opérateur non configuré)
genuc.webhook.secret=

# Secrets par opérateur (OBLIGATOIRES en production)
genuc.webhook.vodacom.secret=${VODACOM_WEBHOOK_SECRET:}
genuc.webhook.airtel.secret=${AIRTEL_WEBHOOK_SECRET:}
genuc.webhook.orange.secret=${ORANGE_WEBHOOK_SECRET:}
genuc.webhook.afrimoney.secret=${AFRIMONEY_WEBHOOK_SECRET:}

# ─── Whitelist IP (NOUVEAU) ───────────────────────────────────────────────
# Activation de la whitelist IP (recommandé true en production)
genuc.webhook.ip-whitelist.active=true

# Whitelist IP par opérateur (séparées par des virgules)
# Format: adresse IP simple ou CIDR (ex: 195.242.1.0/24)
# IMPORTANT: Ces IP doivent être les IP officielles des serveurs webhook des opérateurs
#
# Pour obtenir les IP officielles, contacter chaque opérateur :
# - Vodacom M-Pesa : Demander les IP des serveurs webhook
# - Airtel Money : Demander les IP des serveurs webhook  
# - Orange Money : Demander les IP des serveurs webhook
# - AfriMoney : Demander les IP des serveurs webhook
#
# Exemple de configuration (à remplacer par les IP réelles) :
genuc.webhook.ip-whitelist.vodacom=${VODACOM_IP_WHITELIST:}
genuc.webhook.ip-whitelist.airtel=${AIRTEL_IP_WHITELIST:}
genuc.webhook.ip-whitelist.orange=${ORANGE_IP_WHITELIST:}
genuc.webhook.ip-whitelist.afrimoney=${AFRIMONEY_IP_WHITELIST:}

# ─── Configuration Stripe (existante) ─────────────────────────────────────
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.webhook.require-signature=true

# ─── Simulation (DÉSACTIVÉ en production) ────────────────────────────────
# Ces propriétés doivent être false en production
genuc.payment.mobile-money.simulation-enabled=false
genuc.payment.card.simulation-enabled=false

# ─── Configuration Production (NOUVEAU - Vérification automatique) ────────
# URL publique pour les webhooks (nécessaire pour la callback URL)
genuc.webhook.public-base-url=${GENUC_PUBLIC_BASE_URL:https://genuc.cd}

# ============================================================================
# INSTRUCTIONS DE DÉPLOIEMENT
# ============================================================================
#
# 1. Avant déploiement en production :
#    - Configurer les secrets webhook de chaque opérateur
#    - Obtenir et configurer les whitelist IP officielles
#    - S'assurer que stripe.api.key et stripe.webhook.secret sont configurés
#    - Vérifier que les simulations sont désactivées
#
# 2. Variables d'environnement recommandées :
#    export VODACOM_WEBHOOK_SECRET="votre_secret_vodacom"
#    export AIRTEL_WEBHOOK_SECRET="votre_secret_airtel"
#    export ORANGE_WEBHOOK_SECRET="votre_secret_orange"
#    export AFRIMONEY_WEBHOOK_SECRET="votre_secret_afrimoney"
#    export VODACOM_IP_WHITELIST="195.242.1.0/24,197.253.0.0/16"
#    export AIRTEL_IP_WHITELIST="196.202.0.0/16"
#    export ORANGE_IP_WHITELIST="41.205.0.0/16"
#    export AFRIMONEY_IP_WHITELIST="197.234.0.0/16"
#    export STRIPE_API_KEY="sk_live_..."
#    export STRIPE_WEBHOOK_SECRET="whsec_..."
#    export GENUC_PUBLIC_BASE_URL="https://genuc.cd"
#
# 3. Tests post-déploiement :
#    - Vérifier les logs de démarrage (configuration webhook)
#    - Tester un webhook de chaque opérateur
#    - Surveiller les logs de rejet IP
#    - Vérifier les métriques d'écarts de montant
#
# 4. Surveillance :
#    - Logs "Webhook X déjà traité" -> webhooks dupliqués (normal)
#    - Logs "Écart montant webhook" -> investigation requise si fréquent
#    - Logs "IP non autorisée" -> ajuster whitelist si nécessaire
# ============================================================================
