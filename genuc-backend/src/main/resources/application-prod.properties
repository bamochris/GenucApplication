# GENUC Platform - Production Profile
spring.config.activate.on-profile=prod

# Port d'écoute. La plupart des hébergeurs conteneurisés (Render, Railway, Koyeb, Cloud Run,
# Heroku) imposent le port par la variable PORT et n'acheminent le trafic que vers celui-ci ;
# à défaut on garde SERVER_PORT puis 8082 (valeur exposée par Dockerfile.backend).
server.port=${PORT:${SERVER_PORT:8082}}

# Database - Production (RDS)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate : validate seulement — Flyway gère le schéma
spring.jpa.hibernate.ddl-auto=validate

# Flyway activé en production
spring.flyway.enabled=true

# Redis - Production (ElastiCache / Redis managé)
# Seul l'hôte est obligatoire : port et mot de passe ont des valeurs par défaut utilisables
# (6379, pas d'authentification) pour un Redis sans mot de passe.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Logging - Production
logging.level.root=WARN
logging.level.cd.genuc=INFO
logging.level.org.springframework.security=INFO

# ─── Empreinte mémoire (conteneurs à faible RAM) ─────────────────────────────
# Les valeurs par défaut d'application.yml visent un serveur dédié. Sur un conteneur
# de 512 Mo, elles suffisent à elles seules à faire dépasser la limite au démarrage.
# Toutes restent surchargeables par variable d'environnement : sur une instance plus
# grande, remonter DB_POOL_SIZE et TOMCAT_MAX_THREADS aux valeurs d'application.yml.
#
# ⚠️ NE PAS ajouter spring.main.lazy-initialization=true pour gagner de la mémoire :
# les beans porteurs de @Scheduled (TransactionTimeoutJob, ScheduledPenaliteService,
# ScheduledAlerteService, MetricsScheduler, ScheduledTasks) ne seraient jamais
# instanciés, donc jamais enregistrés — les tâches planifiées cesseraient de s'exécuter
# en silence, dont l'expiration des transactions de paiement.

# Chaque thread Tomcat réserve sa pile ; 200 threads devant un pool de 30 connexions
# n'ajoutent aucun débit réel, ils ne font qu'occuper la mémoire.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:25}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}

# Pools de connexions : une petite instance ne soutient pas 30 + 15 connexions.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.replica.maximum-pool-size=${DB_REPLICA_POOL_SIZE:4}
spring.datasource.replica.minimum-idle=${DB_REPLICA_POOL_MIN_IDLE:1}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_SIZE:16}

# Les histogrammes de percentiles allouent un jeu de compartiments PAR URI observée.
# Avec 763 endpoints, c'est le poste de métriques le plus coûteux en mémoire, pour un
# usage nul tant qu'aucun Prometheus ne consomme /actuator/prometheus. Les compteurs
# et les SLO restent exportés.
management.metrics.distribution.percentiles-histogram.http.server.requests=${METRICS_HISTOGRAMS:false}

# Aucun outil ne se connecte en JMX sur un conteneur : autant ne pas construire le registre.
spring.jmx.enabled=false

# JWT - Production (doit correspondre à la clé lue par JwtService : genuc.jwt.secret)
genuc.jwt.secret=${JWT_SECRET}
genuc.jwt.expiration=86400000

# Webhooks de paiement - Production : signature OBLIGATOIRE.
# Fournir un secret par opérateur (partagé avec l'agrégateur/opérateur).
genuc.webhook.require-signature=true
genuc.webhook.vodacom.secret=${WEBHOOK_VODACOM_SECRET:}
genuc.webhook.airtel.secret=${WEBHOOK_AIRTEL_SECRET:}
genuc.webhook.orange.secret=${WEBHOOK_ORANGE_SECRET:}
genuc.webhook.afrimoney.secret=${WEBHOOK_AFRIMONEY_SECRET:}
genuc.payment.mobile-money.simulation-enabled=false
genuc.payment.card.simulation-enabled=false

# Payment Providers - Production
vodacom.mpesa.api.url=${VODACOM_API_URL:${MPESA_API_URL:}}
vodacom.mpesa.api.key=${VODACOM_API_KEY:${MPESA_CONSUMER_KEY:}}
vodacom.mpesa.api.secret=${VODACOM_API_SECRET:${MPESA_CONSUMER_SECRET:}}
vodacom.mpesa.shortcode=${VODACOM_SHORTCODE:${MPESA_SHORTCODE:}}

airtel.money.api.url=${AIRTEL_API_URL:}
airtel.money.api.key=${AIRTEL_API_KEY:${AIRTEL_CLIENT_ID:}}
airtel.money.api.secret=${AIRTEL_API_SECRET:${AIRTEL_CLIENT_SECRET:}}
airtel.money.merchant.code=${AIRTEL_MERCHANT_CODE:}

orange.money.api.url=${ORANGE_API_URL:}
orange.money.api.key=${ORANGE_API_KEY:${ORANGE_CLIENT_ID:}}
orange.money.api.secret=${ORANGE_API_SECRET:${ORANGE_CLIENT_SECRET:}}
orange.money.merchant.code=${ORANGE_MERCHANT_CODE:}

afrimoney.api.url=${AFRIMONEY_API_URL:}
afrimoney.client.id=${AFRIMONEY_CLIENT_ID:}
afrimoney.client.secret=${AFRIMONEY_CLIENT_SECRET:}
afrimoney.merchant.code=${AFRIMONEY_MERCHANT_CODE:}

stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.webhook.require-signature=true

# WhatsApp Business (Meta Cloud API) - Production
# ⚠️ NE PAS retirer les « : » de fin. Une propriété définie ici masque le défaut du @Value
# côté Java : Spring trouve la clé, puis échoue à résoudre le placeholder IMBRIQUÉ si la
# variable d'environnement est absente (« Could not resolve placeholder ... »), et le défaut
# de @Value("${whatsapp.access-token:DUMMY}") n'est jamais atteint. L'intégration est
# optionnelle (whatsapp.enabled=false par défaut) : elle ne doit pas empêcher le démarrage.
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.enabled=${WHATSAPP_ENABLED:false}

# Firebase Cloud Messaging (notifications push) - Production — optionnel, cf. remarque ci-dessus
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
firebase.enabled=${FIREBASE_ENABLED:false}

# Swagger - Production (disabled)
springdoc.swagger-ui.enabled=false

# AWS S3 - Production — optionnel (aws.s3.enabled reste false tant que AWS_S3_ENABLED
# n'est pas positionné : le stockage se fait alors sur le disque local, cf. genuc.uploads).
# S3Config crée pourtant ses beans dans TOUS les cas : sans défaut ici, le démarrage
# échouait sur « Could not resolve placeholder 'AWS_REGION' » (cf. remarque WhatsApp).
# Sans clés explicites, le SDK retombe sur DefaultCredentialsProvider (rôle IAM).
aws.region=${AWS_REGION:eu-west-3}
aws.s3.bucket=${AWS_S3_BUCKET:genuc-documents}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
