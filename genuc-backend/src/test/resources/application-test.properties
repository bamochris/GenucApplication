# src/test/resources/application-test.properties
# Configuration pour les tests H2 (base mémoire)

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Réplica = même base H2 (le RoutingDataSource exige les deux pools)
spring.datasource.replica.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.replica.username=sa
spring.datasource.replica.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.sql.init.mode=always

# JWT pour tests
genuc.jwt.secret=test_secret_key_for_unit_tests_only
genuc.jwt.expiration=3600000

# Logging
logging.level.cd.genuc=DEBUG