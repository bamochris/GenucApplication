version: '3.8'

services:

  # ─── Base de données principale (écriture) ────────────────────────────
  postgres:
    image: postgres:15
    container_name: genuc_postgres
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c wal_keep_size=64
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    environment:
      POSTGRES_DB: genuc_db
      POSTGRES_USER: genuc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genuc_user -d genuc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genuc_network

  # ─── Replica PostgreSQL (lecture seule) ──────────────────────────────
  postgres-replica:
    image: postgres:15
    container_name: genuc_postgres_replica
    command: >
      bash -c "
        until pg_basebackup -h postgres -D /var/lib/postgresql/data
          -U replicator -Fp -Xs -P -R 2>/dev/null; do
          echo 'Attente primary...' && sleep 3
        done
        echo 'standby_mode = on' >> /var/lib/postgresql/data/recovery.conf
        postgres
      "
    environment:
      POSTGRES_USER: genuc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPASSWORD: ${REPLICATOR_PASSWORD:replicator_password}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genuc_user"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - genuc_network

  # ─── PgBouncer — pool de connexions devant le primary ─────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: genuc_pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: genuc_db
      DATABASES_USER: genuc_user
      DATABASES_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 5000
      PGBOUNCER_DEFAULT_POOL_SIZE: 100
      PGBOUNCER_RESERVE_POOL_SIZE: 20
      PGBOUNCER_RESERVE_POOL_TIMEOUT: 5
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: 0
      PGBOUNCER_LOG_CONNECTIONS: 0
      PGBOUNCER_LOG_DISCONNECTIONS: 0
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U genuc_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genuc_network

  # ─── PgBouncer replica ─────────────────────────────────────────────────
  pgbouncer-replica:
    image: pgbouncer/pgbouncer:latest
    container_name: genuc_pgbouncer_replica
    environment:
      DATABASES_HOST: postgres-replica
      DATABASES_PORT: 5432
      DATABASES_DBNAME: genuc_db
      DATABASES_USER: genuc_user
      DATABASES_PASSWORD: ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 3000
      PGBOUNCER_DEFAULT_POOL_SIZE: 50
      PGBOUNCER_RESERVE_POOL_SIZE: 10
      PGBOUNCER_SERVER_IDLE_TIMEOUT: 600
      PGBOUNCER_LOG_CONNECTIONS: 0
      PGBOUNCER_LOG_DISCONNECTIONS: 0
    ports:
      - "6433:5432"
    depends_on:
      postgres-replica:
        condition: service_healthy
    networks:
      - genuc_network

  # ─── Cache Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: genuc_redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --hz 20
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genuc_network

  # ─── Kafka (notifications/webhooks async) ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: genuc_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - genuc_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: genuc_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - genuc_network

  # ─── Tempo (tracing distribué — dev local) ────────────────────────────
  tempo:
    image: grafana/tempo:latest
    container_name: genuc_tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "4318:4318"
      - "3200:3200"
    networks:
      - genuc_network

  # ─── Backend Spring Boot ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: genuc_backend
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Primary via PgBouncer (pool de connexions)
      DB_URL: jdbc:postgresql://pgbouncer:5432/genuc_db
      DB_USERNAME: genuc_user
      # Pas de fallback en clair — définir DB_PASSWORD dans le .env local (voir .env.example)
      DB_PASSWORD: ${DB_PASSWORD}
      # Replica via PgBouncer replica
      REPLICA_URL: jdbc:postgresql://pgbouncer-replica:5432/genuc_db
      REPLICA_USERNAME: genuc_user
      REPLICA_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Pas de fallback en clair — définir JWT_SECRET dans le .env local (voir .env.example)
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_BASE_URL: http://localhost
      FLYWAY_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SAMPLING_PROBABILITY: ${OTEL_SAMPLING_PROBABILITY:-1.0}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-false}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-genuc-documents}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - genuc_network

  # ─── Frontend React ────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: genuc_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - genuc_network

volumes:
  postgres_data:
  postgres_replica_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  tempo_data:

networks:
  genuc_network:
    driver: bridge
